name: Docker Build & Push to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Check Docker
      - name: Docker Version & Status
        run: |
          docker --version
          docker ps

      # Step 3: Login to GitHub Container Registry
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY \
            -u "${{ github.actor }}" --password-stdin

      # Step 4: Build Docker Image
      - name: Build Docker Image
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME:${{ github.run_number }} \
            -t $REGISTRY/$IMAGE_NAME:latest .

      # Step 5: Display Docker Images
      - name: Verify Docker Image
        run: docker images

      # Step 6: Push Versioned Image
      - name: Push Versioned Image
        run: docker push $REGISTRY/$IMAGE_NAME:${{ github.run_number }}

      # Step 7: Push Latest Image
      - name: Push Latest Image
        run: docker push $REGISTRY/$IMAGE_NAME:latest
      # Step 8: Logout from GHCR
      - name: Logout from GHCR
        if: always()
        run: docker logout $REGISTRY
