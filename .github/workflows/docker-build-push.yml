name: Docker Build & Push to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jnareshkumar/docker_custom_image

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Image
        run: |
          docker build -t $REGISTRY/$IMAGE_NAME:${{ github.run_number }} -t $REGISTRY/$IMAGE_NAME:latest .

      - name: Push Images
        run: |
          docker push $REGISTRY/$IMAGE_NAME:${{ github.run_number }}
          docker push $REGISTRY/$IMAGE_NAME:latest
```
